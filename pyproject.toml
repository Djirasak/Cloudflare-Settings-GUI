[project]
name = "cloudflare-settings-gui"
version = "0.1.0"
description = "A desktop GUI for viewing and managing Cloudflare zone settings"
readme = "README.md"
authors = [
    { name = "Jirasak Duangkamjan", email = "cpe.djirasak@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cloudflare>=5.7.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pyqt6>=6.11.0",
]

[project.scripts]
cloudflare-settings-gui = "cloudflare_settings_gui:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
